[project]
name = "vahtovik"
version = "0.1.0"
description = "AI monitoring tool: watch sources, process artifact groups in persistent Claude Code sessions, report to channels"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.scripts]
vahtovik = "vahtovik.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vahtovik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
