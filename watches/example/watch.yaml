# Example watch: new releases of uv (the Python package manager).
enabled: true
interval: 6h
sources:
  - id: uv-releases
    skill: rss
    params: {url: "https://github.com/astral-sh/uv/releases.atom", max: 10}
channels: [local-log]           # add ops-telegram here once it is defined in vahtovik.yaml
# claude: {group: {effort: xhigh}}   # optional per-stage overrides of vahtovik.yaml
