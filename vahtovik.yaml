# vahtovik global configuration. Secrets go to .env, not here.

claude:
  auth: subscription          # subscription (your Claude login) or api-key (ANTHROPIC_API_KEY, runs with --bare)
  config_dir: null            # optional separate CLAUDE_CONFIG_DIR for vahtovik sessions
  model: claude-opus-5-5
  stages:                     # defaults per stage; a watch can override them in its watch.yaml
    monitor: {effort: medium, max_budget_usd: 0.50}
    group:   {effort: high,   max_budget_usd: 2.00}

channels:
  local-log:
    skill: file
    env: {FILE_CHANNEL_PATH: data/outbox.md}
  # ops-telegram:
  #   skill: telegram
  #   env: {TELEGRAM_CHAT_ID: "-1001234567890"}   # TELEGRAM_BOT_TOKEN comes from .env
