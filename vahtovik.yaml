# vahtovik global configuration. Secrets go to .env, not here.

claude:
  auth: subscription          # subscription (your Claude login) or api-key (ANTHROPIC_API_KEY, runs with --bare)
  config_dir: null            # optional separate CLAUDE_CONFIG_DIR for vahtovik sessions
  model: opus                 # an alias: Claude Code uses the newest Opus
  effort: high                # low, medium, high, xhigh or max
  stages:                     # settings per stage; a watch can set its own model and effort, and override these
    monitor: {max_budget_usd: 1.00}   # per monitor session: one per source per run
    # group: {effort: xhigh}  # group sessions are interactive: max_budget_usd does not apply to them
    watchdog: {model: sonnet, effort: medium, max_budget_usd: 1.00}   # belongs to no watch
    # input: {model: opus, effort: xhigh}   # the default: answers your messages from channels with `input`
  parallel_turns: 5           # the most group turns that work at once; the rest start at a later run

tmux:                         # group sessions run in windows of this tmux session; `vahtovik open` shows you one
  session: vahtovik-agents
  socket: vahtovik            # a tmux server of its own (tmux -L vahtovik); null: your default tmux server

watchdog:                     # looks after the group session windows at the start of a run (see README)
  every: 5m                   # how often; 0: at every run
  notify_every: 6h            # repeat a notice about a group that waits for you or needs attention; 0: never
  long_turn_after: 3h         # warn once about a group turn running this long; 0: never

channels:
  local-log:
    skill: file
    env: {FILE_CHANNEL_PATH: data/outbox.md}
  # ops-telegram:
  #   skill: telegram
  #   env: {TELEGRAM_CHAT_ID: "-1001234567890"}   # TELEGRAM_BOT_TOKEN comes from .env
  #   input: {}                 # optional: read your messages from the chat every minute, and answer them
